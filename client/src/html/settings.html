<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" type="text/css" href="../css/settings.css">
    <title>系统设置</title>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>系统设置</h1>
            <button id="returnMain">返回主页</button>
            <hr>
        </div>
        
        <div class="settings-form">
            <div class="form-section">
                <h2>基本设置</h2>
                <label>界面语言：
                    <select>
                        <option>简体中文</option>
                        <option>English</option>
                    </select>
                </label>
                
                <label>时区设置：
                    <select>
                        <option>UTC+08:00 中国标准时间</option>
                        <option>UTC-05:00 美国东部时间</option>
                    </select>
                </label>
            </div>

            <div class="form-section">
                <h2>财务设置</h2>
                <label>默认货币：
                    <select>
                        <option>人民币 (CNY)</option>
                        <option>美元 (USD)</option>
                        <option>欧元 (EUR)</option>
                    </select>
                </label>
                
                <label>税率设置：
                    <input type="number" step="0.01" placeholder="输入默认税率%">
                </label>
            </div>
        </div>
    </div>
    <script src="../javascript/settings.js"></script>
</body>
</html>
